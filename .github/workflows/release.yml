name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          standalone: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Prepare versioned package and release notes
        run: pnpm run release:prepare "$GITHUB_REF_NAME"
      - name: Test the exact release archive
        shell: bash
        run: |
          pnpm run test:package "release/$GITHUB_REF_NAME/t3code-mcp.tgz"
          cd "release/$GITHUB_REF_NAME"
          sha256sum --check SHA256SUMS
      - name: Create a draft with assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          directory="release/$GITHUB_REF_NAME"
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" \
            "$directory/t3code-mcp.tgz" \
            "$directory/SHA256SUMS" \
            --verify-tag --draft "${prerelease[@]}" \
            --title "T3 Code MCP $GITHUB_REF_NAME" \
            --notes-file "$directory/release-notes.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false
